name: Prompt injection benchmark checks
on:
  push:
    paths: ['prompt-injection-bench/**', '.github/workflows/prompt-injection-bench.yml']
  pull_request:
    paths: ['prompt-injection-bench/**', '.github/workflows/prompt-injection-bench.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m unittest discover -s tests -v
        working-directory: prompt-injection-bench
