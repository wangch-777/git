# 二分类基线实验配置（示例）
dataset: unsw_nb15
task: binary          # binary 或 multiclass，二者为独立任务
split_version: v1
val_size: 0.2
seed: 42
# 候选算法与调参范围（控制实验数量，记录种子）
algorithms:
  - name: dummy
    params: { strategy: most_frequent }
  - name: logistic_regression
    params: { max_iter: 1000 }
  - name: decision_tree
    params: { random_state: 42 }
  - name: random_forest
    params: { n_estimators: 200, max_depth: null, min_samples_leaf: 3, random_state: 42, class_weight: balanced }
metrics: [macro_f1, attack_recall, fpr, average_precision]